<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="100" y1="100" x2="700" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="canvas-grad" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="100%" stop-color="#11111B" />
    </linearGradient>
    <filter id="shadow" x="80" y="80" width="640" height="440" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Glowing Backdrop -->
  <circle cx="400" cy="300" r="240" fill="url(#primary-grad)" opacity="0.15" filter="blur(60px)" />

  <!-- Canvas Window -->
  <g filter="url(#shadow)">
    <rect x="120" y="100" width="560" height="380" rx="16" fill="url(#canvas-grad)" stroke="#313244" stroke-width="2"/>
    
    <!-- Top Bar -->
    <rect x="120" y="100" width="560" height="40" rx="16" fill="#181825"/>
    <path d="M120 124 H680 V140 H120 Z" fill="#181825"/>
    <circle cx="150" cy="120" r="6" fill="#F38BA8" />
    <circle cx="170" cy="120" r="6" fill="#F9E2AF" />
    <circle cx="190" cy="120" r="6" fill="#A6E3A1" />
    
    <!-- Title pill -->
    <rect x="340" y="110" width="120" height="20" rx="10" fill="#313244" opacity="0.6"/>
    <text x="400" y="124" fill="#CDD6F4" font-size="10" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">KUBUILD CANVAS</text>

    <!-- Sidebar Left -->
    <rect x="136" y="156" width="100" height="308" rx="8" fill="#181825" stroke="#313244" stroke-width="1"/>
    <rect x="148" y="172" width="76" height="12" rx="4" fill="#45475A"/>
    <rect x="148" y="196" width="56" height="8" rx="3" fill="#313244"/>
    <rect x="148" y="214" width="68" height="8" rx="3" fill="#313244"/>
    <rect x="148" y="232" width="48" height="8" rx="3" fill="#313244"/>
    <rect x="148" y="250" width="60" height="8" rx="3" fill="#313244"/>

    <!-- Main Canvas Area -->
    <rect x="252" y="156" width="296" height="308" rx="8" fill="#11111B" stroke="#313244" stroke-width="1"/>
    
    <!-- Visual Blocks -->
    <rect x="272" y="176" width="256" height="64" rx="8" fill="url(#primary-grad)" opacity="0.9"/>
    <text x="400" y="214" fill="#FFFFFF" font-size="14" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Portable .stora Engine</text>
    
    <rect x="272" y="252" width="122" height="70" rx="6" fill="#181825" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="406" y="252" width="122" height="70" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
    <rect x="272" y="334" width="256" height="110" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>

    <!-- Inspector Right -->
    <rect x="564" y="156" width="100" height="308" rx="8" fill="#181825" stroke="#313244" stroke-width="1"/>
    <rect x="576" y="172" width="76" height="12" rx="4" fill="#45475A"/>
    <rect x="576" y="196" width="76" height="24" rx="4" fill="#313244"/>
    <rect x="576" y="230" width="76" height="24" rx="4" fill="#313244"/>
    <rect x="576" y="264" width="76" height="24" rx="4" fill="#313244"/>
  </g>
</svg>
