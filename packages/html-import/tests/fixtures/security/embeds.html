<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Embeds</title></head>
<body>
  <section>
    <h2>Embedded content</h2>
    <object data="https://evil.example.com/movie.swf" type="application/x-shockwave-flash"><param name="allowScriptAccess" value="always"></object>
    <object data="javascript:alert(1)"></object>
    <embed src="https://evil.example.com/movie.swf">
    <embed src="javascript:alert(2)">
    <applet code="Evil.class"></applet>
    <iframe src="https://evil.example.com/frame.html" sandbox="allow-scripts allow-same-origin"></iframe>
    <frameset><frame src="javascript:alert(3)"></frameset>
    <template><script>alert(4)</script><img src=x onerror=alert(5)></template>
    <noscript><img src=x onerror=alert(6)></noscript>
    <script>alert(7)</script>
    <script type="module">import 'https://evil.example.com/m.js';</script>
    <script type="application/ld+json">{"@context":"https://schema.org"}</script>
    <p>Visible paragraph.</p>
  </section>
</body>
</html>
