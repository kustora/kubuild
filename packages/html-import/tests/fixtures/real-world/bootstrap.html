<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbor Coffee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Subset of Bootstrap 5 utilities the page relies on (the CDN sheet is not fetched in tests). */
    .container { width: 100%; max-width: 1140px; padding-right: 12px; padding-left: 12px; margin-right: auto; margin-left: auto; }
    .row { display: flex; flex-wrap: wrap; margin-right: -12px; margin-left: -12px; }
    .col-md-4 { flex: 0 0 auto; width: 33.33333333%; padding: 0 12px; }
    .navbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
    .navbar-brand { font-size: 1.25rem; font-weight: 700; }
    .navbar-nav { display: flex; gap: 16px; list-style: none; padding-left: 0; margin: 0; }
    .nav-link { color: rgba(0, 0, 0, 0.65); text-decoration: none; }
    .btn { display: inline-block; padding: 6px 12px; border: 1px solid transparent; border-radius: 6px; font-weight: 400; text-decoration: none; }
    .btn-primary { color: #fff; background-color: #0d6efd; border-color: #0d6efd; }
    .btn-primary:hover { background-color: #0b5ed7; }
    .btn-lg { padding: 8px 16px; font-size: 1.25rem; border-radius: 8px; }
    .display-4 { font-size: 3.5rem; font-weight: 300; line-height: 1.2; }
    .lead { font-size: 1.25rem; font-weight: 300; }
    .py-5 { padding-top: 3rem !important; padding-bottom: 3rem !important; }
    .text-center { text-align: center !important; }
    .bg-light { background-color: #f8f9fa !important; }
    .card { display: flex; flex-direction: column; border: 1px solid rgba(0, 0, 0, 0.175); border-radius: 6px; background: #fff; }
    .card-img-top { width: 100%; border-top-left-radius: 5px; border-top-right-radius: 5px; }
    .card-body { flex: 1 1 auto; padding: 16px; }
    .card-title { margin-bottom: 8px; font-size: 1.25rem; }
    .alert { padding: 16px; border: 1px solid transparent; border-radius: 6px; }
    .alert-info { color: #055160; background-color: #cff4fc; border-color: #9eeaf9; }
    @media (max-width: 767.98px) { .col-md-4 { width: 100%; } .display-4 { font-size: calc(1.475rem + 2.7vw); } }
  </style>
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <a class="navbar-brand" href="#">Harbor Coffee</a>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#menu">Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="#visit">Visit</a></li>
      </ul>
    </nav>
  </div>
  <div class="bg-light py-5 text-center">
    <div class="container">
      <h1 class="display-4">Slow coffee, fast mornings</h1>
      <p class="lead">Single-origin beans roasted every Tuesday at the harbor.</p>
      <a class="btn btn-primary btn-lg" href="#menu" role="button">See the menu</a>
    </div>
  </div>
  <div class="container py-5" id="menu">
    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <img class="card-img-top" src="https://images.example.com/espresso.jpg" alt="Espresso">
          <div class="card-body"><h5 class="card-title">Espresso</h5><p class="card-text">Dark chocolate, cherry.</p></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <img class="card-img-top" src="https://images.example.com/flat-white.jpg" alt="Flat white">
          <div class="card-body"><h5 class="card-title">Flat white</h5><p class="card-text">Silky, balanced.</p></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <img class="card-img-top" src="https://images.example.com/cold-brew.jpg" alt="Cold brew">
          <div class="card-body"><h5 class="card-title">Cold brew</h5><p class="card-text">Steeped 18 hours.</p></div>
        </div>
      </div>
    </div>
    <div class="alert alert-info" role="alert" id="visit">Open daily 7am–3pm, Pier 4.</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
